[project]
name = "confidentiality-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "n3gm", email = "lamaalharbi273@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "faker>=40.41.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "spacy>=3.8.16",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
confidentiality-detector = "confidentiality_detector:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project]
name = "confidentiality-detector"
version = "0.1.0"
description = "Local detector that blocks prompts containing 13 categories of sensitive information before they reach an external LLM"
readme = "README.md"
authors = [
    { name = "n3gm", email = "lamaalharbi273@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.4.6",
    "phonenumbers==9.0.40",
    "scikit-learn>=1.9.1",
    "seqeval>=1.2.2",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
confidentiality-detector = "confidentiality_detector.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Round 1 Presidio baseline only (scripts/predict.py --detector presidio): uv sync --group baselines
baselines = [
    "en-core-web-lg",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "spacy>=3.8.16",
]
# The archived notebooks (archive/): uv sync --group notebooks
notebooks = [
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
]

[tool.uv]
package = true  # install the project itself (editable) so `python -m confidentiality_detector` and the console script work
link-mode = "copy"  # the environment lives outside OneDrive (scripts/dev_env.ps1); never hardlink files OneDrive has touched

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WASHQ · Security Logs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/washq.css">
</head>
<body>
  <div class="adm">
    <aside class="side">
      <a class="brand" href="index.html" data-lockup="18" title="WASHQ home"></a>
      <nav aria-label="Admin">
        <a class="nav" href="admin.html">Overview</a>
        <a class="nav on" href="logs.html" aria-current="page">Security Logs</a>
      </nav>
      <a class="side-foot" href="workspace.html">← Employee workspace</a>
    </aside>

    <main class="main">
      <div class="mh">
        <h1>Security Logs</h1>
        <span class="demo-badge" id="demoBadge" hidden>DEMO DATA</span>
      </div>

      <form class="filters" id="filters" role="search" autocomplete="off">
        <label>Decision
          <select class="sel" id="fDecision">
            <option value="">All</option>
            <option value="ALLOW">ALLOW</option>
            <option value="BLOCK">BLOCK</option>
          </select>
        </label>
        <label>Data type
          <select class="sel" id="fType"><option value="">All</option></select>
        </label>
        <label>Period
          <select class="sel" id="fDays">
            <option value="1">Today</option>
            <option value="7" selected>Last 7 days</option>
            <option value="30">Last 30 days</option>
          </select>
        </label>
        <label class="grow">Operation ID
          <input class="sel" id="fSearch" type="search" placeholder="WSQ-000317">
        </label>
        <button type="button" class="btn" id="fReset">Reset filters</button>
      </form>

      <div class="tw">
        <table>
          <thead>
            <tr><th><span class="sr-only">Details</span></th><th>Time</th><th>Data types detected</th><th>Decision</th><th>Masking result</th><th>Operation ID</th></tr>
          </thead>
          <tbody id="rows"><tr class="empty-row"><td colspan="6">Loading…</td></tr></tbody>
        </table>
      </div>

      <div class="pager">
        <span id="count"></span>
        <span class="btns">
          <button type="button" class="btn" id="prev">Previous</button>
          <button type="button" class="btn" id="next">Next</button>
        </span>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/logs.js"></script>
</body>
</html>
